name: Build release jar

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name to build, e.g. "v1.0.0 (Minecraft 26.3)"'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: Fabric mod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from release name
        id: meta
        env:
          RELEASE_NAME: ${{ github.event.release.name || inputs.release_name }}
        working-directory: .
        run: |
          if [[ "$RELEASE_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?)\ \(Minecraft\ ([0-9]+\.[0-9]+(\.[0-9]+)?)\)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minecraft=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release name must look like 'v1.0.0 (Minecraft 26.3)' or 'v1.0.0-beta4 (Minecraft 26.3)'. Got: $RELEASE_NAME"
            exit 1
          fi

      - name: Check Minecraft version matches gradle.properties
        env:
          MINECRAFT: ${{ steps.meta.outputs.minecraft }}
        run: |
          expected=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          if [[ "$MINECRAFT" != "$expected" ]]; then
            echo "::error::Release says Minecraft $MINECRAFT but gradle.properties has $expected"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Pversion="$VERSION"

      - name: Locate jar
        id: jar
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          base=$(grep '^archives_base_name=' gradle.properties | cut -d= -f2)
          jar="build/libs/${base}-${VERSION}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "::error::Expected $jar but it was not built"
            ls build/libs
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          JAR: ${{ steps.jar.outputs.path }}
        run: gh release upload "$TAG" "$JAR" --clobber

      - name: Upload jar as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: Fabric mod/${{ steps.jar.outputs.path }}
